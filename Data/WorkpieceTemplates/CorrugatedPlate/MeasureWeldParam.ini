[MeasureGroup0.Weld]
#焊接执行
WeldEnable=1 ;1焊接，0空跑
WeldSpeedMmPerMin=400 ;焊接速度(mm/min)
DryRunSpeedMmPerMin=1000 ;空跑速度(mm/min)
WeldSafeMoveSpeedMmPerMin=1000 ;下枪/收枪安全位移动速度(mm/min)

WorldCoorDir       	=-1 ;世界坐标系Z值方向：1:向上,-1:向下
RobotInstallDir     =-1 ;机器人安装方向
GunAngle            =45.0 ;焊枪角度
GunLaserAngle       =10.0 ;激光和焊枪夹角
GunCameraAngle      =10.0 ;跟踪相机和焊枪夹角
RotateToCamRxDir    	=-1.0 ;机头转向跟踪相机时Rx值变化(非按键正负) 增加1 减小-1
HandEyeDis          	=0.0 ;手眼关系距离
MeasureDisThreshold =50.0 ;测量点距离端点距离阈值
FlatMeasureRx 			=0.0 ;标准平焊测量姿态Rx
FlatMeasureRy 			=30.0 ;标准平焊测量姿态Ry
FlatWeldRx 			=0.0 ;标准立焊焊接姿态Rx
FlatWeldRy 			=30.0 ;标准立焊焊接姿态Ry
NormalWeldRx		=0.0 ;平焊焊接姿态Rx				
NormalWeldRy		=30.0 ;平焊焊接姿态Ry	
CornerTransitionLeadDis =10.0 ;拐点前开始RZ过渡距离(mm)
WeldStartSkipDis      =10.0 ;起点跳过距离(mm)
WeldEndSkipDis        =10.0 ;终点跳过距离(mm)
WeldRzGainDeg         =0.0 ;焊接姿态RZ增益(deg)
StandWeldRx 		=0.0 ;标准立焊焊接姿态Rx
StandWeldRy 		=-70.0 ;标准立焊焊接姿态Ry
TransitionsRx 		=0.0 ;标准收下枪过渡姿态Rx
TransitionsRy 		=30.0 ;标准收下枪过渡姿态Ry
StandWeldScanFreeRx		=10.0 ;标准立焊扫描姿态Rx
StandWeldScanFreeRy		=-50.0 ;标准立焊扫描姿态Ry
StandWeldScanDis		=50 ;标准立焊测量平移距离
StandWeldScanOffsetRz	=0.0 ;标准立焊扫描姿态Rz偏移
WeldNorAngleInHome 	=180.0 ;安全位置姿态对应的可焊接焊缝法相
EndpointSearchDis 	=100.0 ;自由端搜索长度
StartSearchOffeset_RZ					=10.0 ;起点搜索RZ偏移量
EndSearchOffeset_RZ						=0.0 ;终点搜索RZ偏移量
GunDownBackSafeDis						=70.0 ;收下枪安全距离
ShortSeamThreshold						=2000.0 ;先测后焊重新计算测量位置的短边长度阈值
LengthSeamThreshold 					=999999.0 ;超长焊缝阈值 超过此长度焊缝独立一组
PointSpacing        					=1000.0 ;长焊缝中间修正测量点距离
CleanGunDis								=999999.0 ;清枪剪丝距离 (单位m)
FlatWeldContinue						=0 ;首尾相连平焊是否连续焊接
CheckCollideEnable 						=0 ;干涉检测使能
WeldDirection							=1 ;焊接方向
SameSideRelativeDisToBaseCenter			=1100 ;同侧机器人焊接测量时相对基座中心的距离（该参数为最小安全距离）
ContralateralRelativeDisToBaseCenter	=1150 ;对侧机器人焊接测量时相对基座中心的距离
ContralateralExAxisOffset				=300 ;对侧时根据焊接焊缝法向计算外部轴偏移（相对距离最少200mm）保证机器人以前伸状态工作避免勾着焊接
SameSideRelativeExPosDir				=-1 ;根据机器人枪尖相对外部轴正方向或负方向绝对下枪方向
StandInitWeldRy 						=-50.0 ;标准立焊初始焊接姿态Ry  
JudgeOpenTrackLength					=300.0 ;开启跟踪焊缝长度
RemoveCloud								=0 ;是否去点云工作台

