// 这是接口 CorrugatedSheetPointCloudEctration的配置文件

//采集点云是否为正座机械臂采集，是正座机械臂，给true,是倒挂机械臂，给false;
ifupright = true

//工件板厚的一半
Plate_thickness = 5

//去除工件底板，保留立板的高度，默认给5即可
Remove_Floor_ZValue = 6

//多线程数量
Thread_Number = 24

//首尾移动距离
Move_distance = 20

//是否输出中间文件
DEBUGLOG = false

//输出文件夹
LOGPATH =

//平面内点距离
Plane_Threshold = 1.5

//直线合并角度阈值
Merge_Lines_Angle_Threshold = 25

// 直线端头距离阈值
Lines_Dis_Threshold = 30

//直线合并距离阈值
Merge_Lines_Dis_Threshold = 100

//聚类阈值
ClusterTolerance = 3.5

//是否聚类
if_Cluster = false

//缩放比例
Discrete_Value = 4

//膨胀核
Dilate_Value = 13

//腐蚀核
Erode_Value = 9

//干扰性长度
Line_Length = 40

//扫描点云朝向
X_AXIS = 0

Y_AXIS = 0

Z_AXIS = 0

//轨迹存放路径
Save_File_Name = .\AllType.txt

//离散间隔
Step = 2

//是否去干扰
is_remove_noise = true

//是否降采样找平面
is_sample = false

//降采样大小
sample_size = 5

//抬高值
above_z = 0.5

pixel_num = 10