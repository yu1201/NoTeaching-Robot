<svg viewBox="0 0 900 902" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <title>MeasureThenWeldFilterFit 函数拓扑图</title>
  <desc>几何主入口 AnalyzeMeasureThenWeldPath 的管线调用顺序（竖向脊柱）与被多处调用的共享底层原语（右侧）。</desc>
  <style>
    .th{font-size:14px;font-weight:600;fill:#0f172a}
    .ts{font-size:12px;fill:#64748b}
    .t{font-size:12px;fill:#475569}
    .box rect{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
    .core rect{fill:#dbeafe;stroke:#3b82f6;stroke-width:1}
    .core .th{fill:#1e3a8a} .core .ts{fill:#3b5b97}
    .opt rect{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1;stroke-dasharray:5 4}
    .opt .th{fill:#0f766e} .opt .ts{fill:#0d9488}
    .amber rect{fill:#fef3c7;stroke:#f59e0b;stroke-width:1}
    .amber .th{fill:#92400e} .amber .ts{fill:#b45309}
    .arr{stroke:#94a3b8;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="902" fill="#ffffff"/>

  <g class="opt">
    <rect x="20" y="14" width="450" height="46" rx="8"/>
    <text class="th" x="245" y="32" text-anchor="middle" dominant-baseline="central">BilateralPresmoothSdkBaseWeld</text>
    <text class="ts" x="245" y="49" text-anchor="middle" dominant-baseline="central">双边预平滑去锯齿 · 可选前置 · 函数外独立调用</text>
  </g>
  <line x1="245" y1="60" x2="245" y2="82" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <g class="core">
    <rect x="20" y="82" width="450" height="52" rx="8"/>
    <text class="th" x="245" y="100" text-anchor="middle" dominant-baseline="central">AnalyzeMeasureThenWeldPath</text>
    <text class="ts" x="245" y="119" text-anchor="middle" dominant-baseline="central">几何主入口 → PreservePath · 分类点 · 关键点</text>
  </g>
  <line x1="245" y1="134" x2="245" y2="158" class="arr" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="20" y="158" width="450" height="50" rx="8"/>
    <text class="th" x="245" y="175" text-anchor="middle" dominant-baseline="central">预处理</text>
    <text class="ts" x="245" y="193" text-anchor="middle" dominant-baseline="central">FinitePoints · TrimLowerWeldPathByArcLength · MAD 去噪</text>
  </g>
  <line x1="245" y1="208" x2="245" y2="232" class="arr" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="20" y="232" width="450" height="50" rx="8"/>
    <text class="th" x="245" y="249" text-anchor="middle" dominant-baseline="central">建系与投影</text>
    <text class="ts" x="245" y="267" text-anchor="middle" dominant-baseline="central">BuildAxes · ProjectGeometryPoints → (s, h, smoothH)</text>
  </g>
  <line x1="245" y1="282" x2="245" y2="306" class="arr" marker-end="url(#arrow)"/>

  <g class="amber">
    <rect x="20" y="306" width="450" height="82" rx="8"/>
    <text class="th" x="245" y="326" text-anchor="middle" dominant-baseline="central">拐点检测（按输入是否已去噪 二选一）</text>
    <text class="ts" x="245" y="352" text-anchor="middle" dominant-baseline="central">已去噪 → BuildAzimuthCornerKeyIndexes ＋ 直线化兜底</text>
    <text class="ts" x="245" y="372" text-anchor="middle" dominant-baseline="central">未去噪 → BuildGeometryKeyIndexes ＋ 短同类游程清理</text>
  </g>
  <line x1="245" y1="388" x2="245" y2="412" class="arr" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="20" y="412" width="450" height="50" rx="8"/>
    <text class="th" x="245" y="429" text-anchor="middle" dominant-baseline="central">RefineCornersByCoherentBow</text>
    <text class="ts" x="245" y="447" text-anchor="middle" dominant-baseline="central">相干弓自适应补点 · 默认关</text>
  </g>
  <line x1="245" y1="462" x2="245" y2="486" class="arr" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="20" y="486" width="450" height="50" rx="8"/>
    <text class="th" x="245" y="503" text-anchor="middle" dominant-baseline="central">DetectLapMisalignmentBoundaries</text>
    <text class="ts" x="245" y="521" text-anchor="middle" dominant-baseline="central">搭接错位台阶注入 · isLapStepKey 标记并豁免</text>
  </g>
  <line x1="245" y1="536" x2="245" y2="560" class="arr" marker-end="url(#arrow)"/>

  <g class="core">
    <rect x="20" y="560" width="450" height="128" rx="8"/>
    <text class="th" x="245" y="580" text-anchor="middle" dominant-baseline="central">结构纠正级联（顺序执行，每步后重建 isLapStepKey）</text>
    <text class="ts" x="245" y="606" text-anchor="middle" dominant-baseline="central">① RefitCornersByPlatformPattern　平台重算</text>
    <text class="ts" x="245" y="628" text-anchor="middle" dominant-baseline="central">② RecoverEndRegionCornersByPeriod　端区周期补漏</text>
    <text class="ts" x="245" y="650" text-anchor="middle" dominant-baseline="central">③ MergeTooCloseSameTypeCorners　删错</text>
    <text class="ts" x="245" y="672" text-anchor="middle" dominant-baseline="central">④ SnapCornersToPlatforms　按平台边界重定</text>
  </g>
  <line x1="245" y1="688" x2="245" y2="712" class="arr" marker-end="url(#arrow)"/>

  <g class="core">
    <rect x="20" y="712" width="450" height="52" rx="8"/>
    <text class="th" x="245" y="730" text-anchor="middle" dominant-baseline="central">BuildFittedKeyPoints → 分类输出</text>
    <text class="ts" x="245" y="749" text-anchor="middle" dominant-baseline="central">两侧直线求交定位 · start/end/inner/outer · 2mm 加密</text>
  </g>

  <text class="ts" x="544" y="76" text-anchor="start" dominant-baseline="central">共享底层原语（被多处调用，“←”标注调用方）</text>

  <g class="box">
    <rect x="544" y="92" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="110" text-anchor="start" dominant-baseline="central">FitGeometrySegmentLine</text>
    <text class="ts" x="560" y="129" text-anchor="start" dominant-baseline="central">← 方位角检测 · 弯折角 · 关键点求交</text>
  </g>
  <g class="box">
    <rect x="544" y="156" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="174" text-anchor="start" dominant-baseline="central">GeometryBendAngleDegAt</text>
    <text class="ts" x="560" y="193" text-anchor="start" dominant-baseline="central">← 端区周期补漏 · 删错</text>
  </g>
  <g class="box">
    <rect x="544" y="220" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="238" text-anchor="start" dominant-baseline="central">LocalLateralSlopeAt</text>
    <text class="ts" x="560" y="257" text-anchor="start" dominant-baseline="central">← 按平台边界重定</text>
  </g>
  <g class="box">
    <rect x="544" y="284" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="302" text-anchor="start" dominant-baseline="central">FitPlatformTwoCorners</text>
    <text class="ts" x="560" y="321" text-anchor="start" dominant-baseline="central">← 平台重算（坡-平台-坡 三段拟合）</text>
  </g>
  <g class="box">
    <rect x="544" y="348" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="366" text-anchor="start" dominant-baseline="central">GeometryCornerType</text>
    <text class="ts" x="560" y="385" text-anchor="start" dominant-baseline="central">← 删错 · 分类输出</text>
  </g>
  <g class="box">
    <rect x="544" y="412" width="332" height="52" rx="8"/>
    <text class="th" x="560" y="430" text-anchor="start" dominant-baseline="central">GeometryDistanceToSegment2D</text>
    <text class="ts" x="560" y="449" text-anchor="start" dominant-baseline="central">← 直线化兜底 · 相干弓</text>
  </g>

  <line x1="544" y1="500" x2="568" y2="500" class="arr" marker-end="url(#arrow)"/>
  <text class="t" x="576" y="500" text-anchor="start" dominant-baseline="central">实线 = 管线调用顺序</text>
  <rect x="544" y="524" width="24" height="14" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="t" x="576" y="531" text-anchor="start" dominant-baseline="central">蓝 = 主管线核心 / 本次同步的算法</text>
  <rect x="544" y="548" width="24" height="14" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-dasharray="4 3"/>
  <text class="t" x="576" y="555" text-anchor="start" dominant-baseline="central">青虚线 = 可选前置（函数外调用）</text>
  <rect x="544" y="572" width="24" height="14" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="t" x="576" y="579" text-anchor="start" dominant-baseline="central">橙 = 分支（二选一）</text>
</svg>
